[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volt"
version = "0.1.0"
description = "Security Toolkit Manager for Kali Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Volt Team" }
]
dependencies = [
    "textual>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
volt = "volt.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/volt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
